# spring:
#   application:
#     name: network-inventory
spring:
  datasource:
    url: jdbc:h2:file:./data/network-inventory
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html